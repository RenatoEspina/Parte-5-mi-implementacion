# vLLM server for this project's JADE agents (OpenAI-compatible API on http://127.0.0.1:8000/v1).
#
# Sized for one RTX 5060 Laptop GPU (8 GB VRAM, shared with the desktop). Every value below was
# measured on that GPU with vllm/vllm-openai:v0.29.0; see README.md for how to start/stop it.
#
# The model is served under two names: its HuggingFace id and the stable alias `market-llm`.
# The Java client defaults to the alias, so changing the model only means changing VLLM_MODEL.
name: llm-mas-market

services:
  vllm:
    # v0.29.0 ships torch 2.13 + CUDA 13 with sm_120 kernels, required by RTX 50xx (Blackwell).
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.29.0}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      # Offline by default: the model already lives in the `hf-cache` volume, so vLLM does not
      # contact the Hub on start. To serve a model that is not cached yet, start once with
      # `HF_HUB_OFFLINE=0 VLLM_MODEL=<repo id> docker compose up -d --wait` (it downloads it).
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      # Needed alongside `runtime: nvidia` on this host; without them torch reports
      # "CUDA unknown error" inside the container.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - hf-cache:/root/.cache/huggingface
      # JIT caches: NVIDIA driver compute cache, Triton kernels, and vLLM's own (FlashInfer
      # autotune, torch.compile). Without these volumes every `down` + `up` recompiles them.
      - nv-cache:/root/.nv
      - triton-cache:/root/.triton
      - vllm-cache:/root/.cache/vllm
    runtime: nvidia
    ipc: host
    # Must stay above --shutdown-timeout so Docker does not SIGKILL vLLM mid-drain.
    stop_grace_period: 20s
    command:
      - ${VLLM_MODEL:-Qwen/Qwen3.5-0.8B}
      - --served-model-name
      - ${VLLM_MODEL:-Qwen/Qwen3.5-0.8B}
      - market-llm
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-8}"
      # Fraction of the whole GPU (7.61 GiB usable) this server may take; what the weights do not
      # use becomes KV cache. vLLM's default (0.92) refuses to start because the desktop already
      # holds ~0.8 GiB, and 0.8 reserved 4 GiB of KV cache for a 0.8B model. Raise it together
      # with VLLM_MODEL when serving a larger model.
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.5}"
      # No --enforce-eager on purpose: CUDA graphs + torch.compile decode ~2.3x faster on this
      # GPU (188 vs 82 tok/s single request, 560 vs 254 tok/s with 5 concurrent) for 0.04 GiB
      # of extra VRAM, and the compiled graphs are cached in the `vllm-cache` volume.
      # Qwen3.5 checkpoints are vision-language models; the agents only send text, so skip the
      # vision encoder (less VRAM, faster start).
      - --language-model-only
      # Drain mode: the server exits cleanly instead of force-killing its workers.
      - --shutdown-timeout
      - "${VLLM_SHUTDOWN_TIMEOUT:-10}"
      # The default structured-output backend (xgrammar) intermittently rejected EOS under
      # regex-constrained requests (HTTP 500); guidance did not.
      - --structured-outputs-config.backend
      - guidance
    # No `deploy.resources.reservations.devices` block on purpose: combined with
    # `runtime: nvidia` it produced conflicting device visibility ("CUDA unknown error").
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/models >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 180
      start_period: 30s

volumes:
  hf-cache:
    name: llm-mas-market-hf-cache
  nv-cache:
    name: llm-mas-market-nv-cache
  triton-cache:
    name: llm-mas-market-triton-cache
  vllm-cache:
    name: llm-mas-market-vllm-cache
